name: job-props
# NBA oyuncu prop analizi (UTC 15:20 pg_cron; gece turu job-nba-coupon içinde çalışır)
on:
  # Zamanlama Supabase pg_cron'dan (supabase/migrations/*_pg_cron_github_dispatch.sql);
  # GitHub 'schedule' tetikleyicisi bu repoda çalışmadığı için kaldırıldı
  workflow_dispatch:
permissions:
  contents: read
jobs:
  props:
    uses: ./.github/workflows/_run-job.yml
    with:
      task: props
      timeout: 40
    secrets: inherit
