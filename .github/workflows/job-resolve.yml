name: job-resolve
# Bekleyen bahisleri sonuçlandır + son 3 günün sonuçlarını yeniden doğrula (4 saatte bir, UTC)
on:
  # Zamanlama Supabase pg_cron'dan (supabase/migrations/*_pg_cron_github_dispatch.sql);
  # GitHub 'schedule' tetikleyicisi bu repoda çalışmadığı için kaldırıldı
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    uses: ./.github/workflows/_run-job.yml
    with:
      task: resolve
      timeout: 30
    secrets: inherit
