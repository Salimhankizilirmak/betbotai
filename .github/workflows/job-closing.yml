name: job-closing
# Kapanış oranları (CLV/backtest için). 10 dakikada bir bakar; sadece başlamak üzere maç varsa kredi harcar.
on:
  # Zamanlama Supabase pg_cron'dan (supabase/migrations/*_pg_cron_github_dispatch.sql);
  # GitHub 'schedule' tetikleyicisi bu repoda çalışmadığı için kaldırıldı
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closing:
    uses: ./.github/workflows/_run-job.yml
    with:
      task: closing
      timeout: 10
    secrets: inherit
